# Nginx site for PO Bunker (see DEPLOY.md). Plain HTTP to start with:
# `certbot --nginx -d shipping-bunker.barokahperkasagroup.tech` then adds the
# HTTPS server block and the HTTP -> HTTPS redirect to this file.
#
# The app is a static Vite build. deploy/update.sh copies the build into
# /var/www/po-bunker, so a rebuild never leaves the site without files.

server {
    listen 80;
    listen [::]:80;
    server_name shipping-bunker.barokahperkasagroup.tech;

    root /var/www/po-bunker;
    index index.html;

    # Nginx only compresses text/html by default; the JS and CSS bundles are
    # the bulk of the download. Older Nginx labels .js as application/javascript,
    # newer as text/javascript, so list both.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Files in assets/ have a content hash in their name, so they can be cached
    # for good. A new build gets new file names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path falls back to index.html (single-page app). index.html
    # itself must not be cached, otherwise browsers keep loading the previous
    # build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
