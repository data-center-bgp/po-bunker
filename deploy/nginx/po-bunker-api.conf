# Proxies /api/ to the PO Bunker API container (published on 127.0.0.1:8080 only).
# Included from the site's server block(s); update.sh copies this file to
# /etc/nginx/snippets/po-bunker-api.conf, so a change here takes effect on the next deploy.

location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    # Nginx is the edge: send the real client address, never a header the client supplied.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Delivery Order and logo uploads are limited to 5 MB by the API; leave room for the form.
    client_max_body_size 6m;

    # The vessel sync calls the SMS API and can take a while.
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;
}
